name: Aspire Integration Tests (manual)

# Kuulla.AppHost.Tests boots the real AppHost — API, Web, and a real Cosmos DB emulator container
# via DistributedApplicationTestingBuilder (the HTTP-level flow tests and the Playwright browser
# E2E tests share one collection fixture, so the emulator boots once) — and is excluded from
# pr.yml's required checks (see the comment there) because the emulator's own startup time in CI
# is slow and inconsistent: one run had it healthy in ~2 minutes, another exhausted a 3-attempt/
# 5-minute-each retry budget and still timed out. That makes it unsuitable as a PR gate, but
# it's still real coverage worth having on demand — to verify a fix before landing it, or to
# investigate the emulator flakiness itself, without blocking every PR on it.
on:
  workflow_dispatch:

jobs:
  aspire-integration:
    name: Aspire Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Confirmed upstream Aspire bug (microsoft/aspire#15620): without a trusted ASP.NET Core
      # dev cert, RunAsPreviewEmulator still switches the emulator's endpoint metadata to https,
      # but the emulator container's own cert-config step silently no-ops (no cert → nothing to
      # configure) and it starts on plain HTTP instead. Aspire's own internal readiness check then
      # tries HTTPS against that plain-HTTP server, producing a TLS handshake failure ("corrupted
      # frame") the moment any real query runs. Having a dev cert present resolves both sides of
      # that mismatch.
      - name: Trust ASP.NET Core dev certificate
        run: |
          dotnet dev-certs https --clean
          # --trust alone exits non-zero on Linux ("[110] For OpenSSL trust to take effect,
          # '$HOME/.aspnet/dev-certs/trust' must be listed in SSL_CERT_DIR") — export it before
          # trusting, then persist it to $GITHUB_ENV so later steps' OpenSSL calls see it too.
          export SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs"
          dotnet dev-certs https --trust
          echo "SSL_CERT_DIR=$SSL_CERT_DIR" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Kuulla.sln

      - name: Build (Debug)
        run: dotnet build Kuulla.sln --no-restore --configuration Debug

      # AppHostFixture self-installs the Chromium *browser* on first NewPageAsync() (Playwright.
      # Program.Main ["install", "chromium"]), but a bare Linux CI runner is also missing the
      # system libraries (libnss3, libatk, etc.) headless Chromium needs to actually launch —
      # install those too, ahead of the test run that will trigger the browser download.
      - name: Install Playwright browser dependencies
        run: pwsh tests/Kuulla.AppHost.Tests/bin/Debug/net10.0/playwright.ps1 install-deps chromium

      - name: Test AppHost integration (Debug)
        run: dotnet test tests/Kuulla.AppHost.Tests/Kuulla.AppHost.Tests.csproj --no-build --configuration Debug
