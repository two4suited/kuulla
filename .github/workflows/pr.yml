name: PR Build (.NET)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Kuulla.sln'
      - '.github/workflows/pr.yml'

jobs:
  build-dotnet:
    name: Build .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Confirmed upstream Aspire bug (microsoft/aspire#15620): without a trusted ASP.NET Core
      # dev cert, RunAsPreviewEmulator still switches the emulator's endpoint metadata to https,
      # but the emulator container's own cert-config step silently no-ops (no cert → nothing to
      # configure) and it starts on plain HTTP instead. Aspire's own internal readiness check then
      # tries HTTPS against that plain-HTTP server, which is the actual source of the "corrupted
      # frame" TLS failure — not a cert-trust or cipher issue in Kuulla.Api's own CosmosClient (all
      # ruled out already). Having a dev cert present resolves both sides of that mismatch at once.
      - name: Trust ASP.NET Core dev certificate
        run: |
          dotnet dev-certs https --clean
          # --trust alone exits non-zero on Linux ("[110] For OpenSSL trust to take effect,
          # '$HOME/.aspnet/dev-certs/trust' must be listed in SSL_CERT_DIR") — export it before
          # trusting, then persist it to $GITHUB_ENV so later steps' OpenSSL calls see it too.
          export SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs"
          dotnet dev-certs https --trust
          echo "SSL_CERT_DIR=$SSL_CERT_DIR" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Kuulla.sln

      - name: Build (Release)
        run: dotnet build Kuulla.sln --no-restore --configuration Release

      # Debug, not Release: these tests exercise /dev/* endpoints that are #if DEBUG-only by
      # design (never shipped in a Release build).
      - name: Test API (Debug)
        run: dotnet test tests/Kuulla.Api.Tests/Kuulla.Api.Tests.csproj --configuration Debug

      # bUnit component tests — no Cosmos emulator involved, safe to run in Release.
      - name: Test Web
        run: dotnet test tests/Kuulla.Web.Tests/Kuulla.Web.Tests.csproj --no-build --configuration Release

      # Re-attempting Kuulla.AppHost.Tests in CI (issue #62) — previously excluded for a TLS
      # handshake failure ("corrupted frame") against the Cosmos emulator, root-caused to
      # microsoft/aspire#15620 (see the "Trust ASP.NET Core dev certificate" step above).
      - name: Test AppHost integration (Debug)
        run: dotnet test tests/Kuulla.AppHost.Tests/Kuulla.AppHost.Tests.csproj --configuration Debug
