name: PR Build

on:
  pull_request:
    branches: [main]

jobs:
  # Single source of truth for "what changed" so build-dotnet and build-ios can each skip work
  # the diff doesn't touch, while still agreeing on the cases that must run everything: an API
  # change (shared contracts/DTOs consumed by both Web and iOS) or a shared/common project or
  # workflow-file change.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      ios: ${{ steps.filter.outputs.ios }}
      shared: ${{ steps.filter.outputs.shared }}
      apphost: ${{ steps.filter.outputs.apphost }}
      dotnet_other: ${{ steps.filter.outputs.dotnet_other }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'src/Kuulla.Api/**'
              - 'tests/Kuulla.Api.Tests/**'
            web:
              - 'src/Kuulla.Web/**'
              - 'tests/Kuulla.Web.Tests/**'
            ios:
              - 'ios/**'
            shared:
              - 'src/Kuulla.Core/**'
              - 'src/Kuulla.ServiceDefaults/**'
              - 'Kuulla.sln'
              - '.github/workflows/**'
            # AppHost is deployment orchestration only — it isn't a dependency of the iOS app
            # (Swift, not .NET) the way ServiceDefaults/API contracts can be, so it gets its own
            # category rather than feeding into `shared` and triggering an iOS build for nothing.
            apphost:
              - 'src/Kuulla.AppHost/**'
            # Not run by this workflow (see the Kuulla.AppHost.Tests comment below), but still
            # part of Kuulla.sln — a change here should still get build/compile coverage.
            dotnet_other:
              - 'tests/Kuulla.AppHost.Tests/**'

  build-dotnet:
    name: Build .NET
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.apphost == 'true' || needs.changes.outputs.dotnet_other == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Kuulla.sln

      - name: Build (Release)
        run: dotnet build Kuulla.sln --no-restore --configuration Release

      # Debug, not Release: these tests exercise /dev/* endpoints that are #if DEBUG-only by
      # design (never shipped in a Release build). Skipped unless the diff actually touches the
      # API (a shared/common change also counts, since it can affect API behavior indirectly).
      - name: Test API (Debug)
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true'
        run: dotnet test tests/Kuulla.Api.Tests/Kuulla.Api.Tests.csproj --configuration Debug

      # bUnit component tests — no Cosmos emulator involved, safe to run in Release. Also runs on
      # an API change: the API can change shared contracts/DTOs that Web consumes.
      - name: Test Web
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true'
        run: dotnet test tests/Kuulla.Web.Tests/Kuulla.Web.Tests.csproj --no-build --configuration Release

      # Kuulla.AppHost.Tests is excluded from CI: it boots the real Cosmos DB emulator via
      # DistributedApplicationTestingBuilder, and while investigating issue #62 we root-caused
      # its "corrupted frame" TLS failure to a real, fixable bug (microsoft/aspire#15620 — the
      # emulator serves plain HTTP without a trusted dev cert, but Aspire's readiness probe still
      # expects HTTPS), the emulator container's own startup time is separately slow and highly
      # variable on this runner — one CI run had it healthy in ~2 minutes, another never got
      # there before the fixture's retry budget ran out. That makes it unsuitable as a PR gate
      # regardless of the TLS fix. Its Playwright browser E2E tests share the same AppHost
      # collection fixture, so they're in the same boat and run from the same manual workflow.
      # Locally the whole suite runs green in ~1 minute via `dotnet test`.

  build-ios:
    name: Build iOS
    needs: changes
    # Also runs on an API change: the API can change contracts the iOS client consumes.
    if: needs.changes.outputs.ios == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Pin to a specific simulator model (e.g. "iPhone 16") instead of picking one available at
      # runtime, and the runner's Xcode image updates its bundled simulator lineup out from under
      # us — the pinned model disappears and CI fails for reasons unrelated to the PR's diff. Ask
      # simctl for whatever iPhone simulator is actually installed instead.
      - name: Determine simulator destination
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available iOS -j \
            | python3 -c "import json, sys; devices = [d for r in json.load(sys.stdin)['devices'].values() for d in r]; print(next(d['name'] for d in devices if d['name'].startswith('iPhone')))")
          echo "Using simulator: $DEVICE_NAME"
          echo "SIMULATOR_NAME=$DEVICE_NAME" >> "$GITHUB_ENV"

      # KuullaUITests is excluded here: it drives the real app against a real, already-running
      # Kuulla API (KUULLA_API_BASE_URL), and this runner has no AppHost to point it at — see
      # issue #51 for getting the Simulator into the Aspire dev loop. It builds as part of this
      # same `xcodebuild test` invocation (build-for-testing runs for every testable in the
      # scheme regardless of -skip-testing), so it still gets compile coverage on every PR; only
      # actually running it against a live API is deferred. Run it locally against an
      # `aspire run`/`aspire start` API with:
      #   TEST_RUNNER_KUULLA_API_BASE_URL=<api base url> xcodebuild test ... -only-testing:KuullaUITests
      # The TEST_RUNNER_ prefix (not the bare KUULLA_API_BASE_URL the app/tests actually read) is
      # required here: xcodebuild strips it and forwards the rest into the test process's own
      # environment, which is the only way a value set in the invoking shell reaches
      # ProcessInfo.processInfo.environment inside the Simulator — a plain `KUULLA_API_BASE_URL=`
      # export does not cross that boundary.
      - name: Test
        working-directory: ios/Kuulla
        run: |
          xcodebuild test \
            -project Kuulla.xcodeproj \
            -scheme Kuulla \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
            -configuration Debug \
            -skip-testing:KuullaUITests \
            CODE_SIGNING_ALLOWED=NO

  # Structural preview of the deploy pipeline, moved here from deploy.yml so the planned steps are
  # reviewable on the PR instead of only showing up in the post-merge deploy log. Gated on an
  # AppHost change — nothing else in the repo alters the deployment step list.
  #
  # No Azure login: `--list-steps` enumerates the pipeline the AppHost model produces without
  # applying it, and keeping cloud credentials out of PR CI is deliberate. If a future AppHost
  # change makes `aspire deploy --list-steps` require an authenticated Azure context, switch this
  # to `aspire publish --list-steps` (fully offline) rather than granting this job OIDC.
  preview-deploy-steps:
    name: Preview deploy steps
    needs: changes
    if: needs.changes.outputs.apphost == 'true'
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Preview deployment steps
        run: aspire deploy --apphost ./src/Kuulla.AppHost/Kuulla.AppHost.csproj --environment production --list-steps --non-interactive
