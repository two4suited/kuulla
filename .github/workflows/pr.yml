name: PR Build (.NET)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Kuulla.sln'
      - '.github/workflows/pr.yml'

jobs:
  build-dotnet:
    name: Build .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Kuulla.sln

      - name: Build (Release)
        run: dotnet build Kuulla.sln --no-restore --configuration Release

      # Debug, not Release: these tests exercise /dev/* endpoints that are #if DEBUG-only by
      # design (never shipped in a Release build).
      - name: Test API (Debug)
        run: dotnet test tests/Kuulla.Api.Tests/Kuulla.Api.Tests.csproj --configuration Debug

      # bUnit component tests — no Cosmos emulator involved, safe to run in Release.
      - name: Test Web
        run: dotnet test tests/Kuulla.Web.Tests/Kuulla.Web.Tests.csproj --no-build --configuration Release

      # Kuulla.AppHost.Tests is excluded from CI: it boots the real Cosmos DB emulator via
      # DistributedApplicationTestingBuilder, and while investigating issue #62 we root-caused
      # its "corrupted frame" TLS failure to a real, fixable bug (microsoft/aspire#15620 — the
      # emulator serves plain HTTP without a trusted dev cert, but Aspire's readiness probe still
      # expects HTTPS), the emulator container's own startup time is separately slow and highly
      # variable on this runner — one CI run had it healthy in ~2 minutes, another exhausted the
      # fixture's full 3-attempt/5-minute-each retry budget (~17 minutes) and still timed out.
      # That makes it unsuitable as a PR gate regardless of the TLS fix. Kuulla.Web.E2E is
      # excluded for the same reason (it boots the same AppHost, Cosmos emulator included). Both
      # run reliably locally via `dotnet test` against a real `aspire run`/`aspire start` API.
