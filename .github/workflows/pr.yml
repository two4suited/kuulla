name: PR Build

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # The workflow file itself is listed under both filters — a pr.yml change should
          # validate whichever job it touched, and there's no way to tell which from the path
          # alone, so treat it as shared and run both.
          filters: |
            dotnet:
              - 'src/**'
              - 'tests/**'
              - 'Kuulla.sln'
              - '.github/workflows/pr.yml'
            ios:
              - 'ios/**'
              - '.github/workflows/pr.yml'

  build-dotnet:
    name: Build .NET
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Confirmed upstream Aspire bug (microsoft/aspire#15620): without a trusted ASP.NET Core
      # dev cert, RunAsPreviewEmulator still switches the emulator's endpoint metadata to https,
      # but the emulator container's own cert-config step silently no-ops (no cert → nothing to
      # configure) and it starts on plain HTTP instead. Aspire's own internal readiness check then
      # tries HTTPS against that plain-HTTP server, which is the actual source of the "corrupted
      # frame" TLS failure — not a cert-trust or cipher issue in Kuulla.Api's own CosmosClient (all
      # ruled out already). Having a dev cert present resolves both sides of that mismatch at once.
      - name: Trust ASP.NET Core dev certificate
        run: |
          dotnet dev-certs https --clean
          # --trust alone exits non-zero on Linux ("[110] For OpenSSL trust to take effect,
          # '$HOME/.aspnet/dev-certs/trust' must be listed in SSL_CERT_DIR") — export it before
          # trusting, then persist it to $GITHUB_ENV so later steps' OpenSSL calls see it too.
          export SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs"
          dotnet dev-certs https --trust
          echo "SSL_CERT_DIR=$SSL_CERT_DIR" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Kuulla.sln

      - name: Build (Release)
        run: dotnet build Kuulla.sln --no-restore --configuration Release

      # Debug, not Release: these tests exercise /dev/* endpoints that are #if DEBUG-only by
      # design (never shipped in a Release build).
      - name: Test API (Debug)
        run: dotnet test tests/Kuulla.Api.Tests/Kuulla.Api.Tests.csproj --configuration Debug

      # bUnit component tests — no Cosmos emulator involved, safe to run in Release.
      - name: Test Web
        run: dotnet test tests/Kuulla.Web.Tests/Kuulla.Web.Tests.csproj --no-build --configuration Release

      # Re-attempting Kuulla.AppHost.Tests in CI (issue #62) — previously excluded for a TLS
      # handshake failure ("corrupted frame") against the Cosmos emulator, root-caused to
      # microsoft/aspire#15620 (see the "Trust ASP.NET Core dev certificate" step above).
      - name: Test AppHost integration (Debug)
        run: dotnet test tests/Kuulla.AppHost.Tests/Kuulla.AppHost.Tests.csproj --configuration Debug

  build-ios:
    name: Build iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Pin to a specific simulator model (e.g. "iPhone 16") instead of picking one available at
      # runtime, and the runner's Xcode image updates its bundled simulator lineup out from under
      # us — the pinned model disappears and CI fails for reasons unrelated to the PR's diff. Ask
      # simctl for whatever iPhone simulator is actually installed instead.
      - name: Determine simulator destination
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available iOS -j \
            | python3 -c "import json, sys; devices = [d for r in json.load(sys.stdin)['devices'].values() for d in r]; print(next(d['name'] for d in devices if d['name'].startswith('iPhone')))")
          echo "Using simulator: $DEVICE_NAME"
          echo "SIMULATOR_NAME=$DEVICE_NAME" >> "$GITHUB_ENV"

      # KuullaUITests is excluded here: it drives the real app against a real, already-running
      # Kuulla API (KUULLA_API_BASE_URL), and this runner has no AppHost to point it at — see
      # issue #51 for getting the Simulator into the Aspire dev loop. It builds as part of this
      # same `xcodebuild test` invocation (build-for-testing runs for every testable in the
      # scheme regardless of -skip-testing), so it still gets compile coverage on every PR; only
      # actually running it against a live API is deferred. Run it locally against an
      # `aspire run`/`aspire start` API with:
      #   TEST_RUNNER_KUULLA_API_BASE_URL=<api base url> xcodebuild test ... -only-testing:KuullaUITests
      # The TEST_RUNNER_ prefix (not the bare KUULLA_API_BASE_URL the app/tests actually read) is
      # required here: xcodebuild strips it and forwards the rest into the test process's own
      # environment, which is the only way a value set in the invoking shell reaches
      # ProcessInfo.processInfo.environment inside the Simulator — a plain `KUULLA_API_BASE_URL=`
      # export does not cross that boundary.
      - name: Test
        working-directory: ios/Kuulla
        run: |
          xcodebuild test \
            -project Kuulla.xcodeproj \
            -scheme Kuulla \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
            -configuration Debug \
            -skip-testing:KuullaUITests \
            CODE_SIGNING_ALLOWED=NO
