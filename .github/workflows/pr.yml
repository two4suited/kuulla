name: PR Build

on:
  pull_request:
    branches: [main]

jobs:
  build-dotnet:
    name: Build .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Kuulla.sln

      - name: Build (Release)
        run: dotnet build Kuulla.sln --no-restore --configuration Release

      # Debug, not Release: these tests exercise /dev/* endpoints that are #if DEBUG-only by
      # design (never shipped in a Release build).
      - name: Test (Debug)
        run: dotnet test tests/Kuulla.Api.Tests/Kuulla.Api.Tests.csproj --configuration Debug

      # Kuulla.AppHost.Tests is excluded from CI for now: it boots the real Cosmos DB emulator
      # via DistributedApplicationTestingBuilder, and this runner hits a TLS handshake failure
      # ("corrupted frame") inside Aspire's own emulator health check that doesn't reproduce
      # locally — see issue #57 / PR #72 discussion. Kuulla.Web.E2E is excluded for the same
      # reason (it boots the same AppHost, Cosmos emulator included), though it wasn't run in CI
      # separately to confirm — see issue #59. Both run reliably locally in the meantime.

  build-ios:
    name: Build iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: ios/Kuulla
        run: |
          xcodebuild build \
            -project Kuulla.xcodeproj \
            -scheme Kuulla \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
