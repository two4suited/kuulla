name: Deploy to Azure

# Deploys Kuulla to Azure Container Apps via `aspire deploy`. Runs on every push to `main`
# (i.e. after a PR has already passed pr.yml's required checks and been merged) and can also be
# triggered manually. Build/test is not repeated here — pr.yml already gates merges to main, and
# `aspire deploy` builds the containers itself. The deployment-steps preview (`--list-steps`) also
# isn't here — it runs in pr.yml on any change under src/Kuulla.AppHost/**, so the planned steps
# are reviewable before merge rather than only in the post-merge deploy log. The `production`
# GitHub Environment below is
# where the actual gate lives — configure required reviewers on it so this doesn't provision/
# update cloud resources unattended (see issue #365).

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: aspire deploy
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy with Aspire
        run: aspire deploy --apphost ./src/Kuulla.AppHost/Kuulla.AppHost.csproj --environment production --non-interactive
        env:
          Azure__SubscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          Azure__Location: ${{ vars.AZURE_LOCATION }}
          Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          Parameters__google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
          Parameters__google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          Parameters__redis_password: ${{ secrets.REDIS_PASSWORD }}
          Parameters__google_ios_client_id: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
          Parameters__apns_key_id: ${{ vars.APNS_KEY_ID }}
          Parameters__apns_team_id: ${{ vars.APNS_TEAM_ID }}
          Parameters__apns_bundle_id: ${{ vars.APNS_BUNDLE_ID }}
          Parameters__apns_private_key: ${{ secrets.APNS_PRIVATE_KEY }}
