<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Kuulla "Signal" app icon — nodes on a waveform (the sync graph).
       An asymmetric signal transient: spike, overshoot, settle.
       Two nodes lit in lime, two bone. Flat, no bevel. See docs/brand.md §8. -->
