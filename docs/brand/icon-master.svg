  <polyline points="226,596 416,330 571,700 786,470"
    fill="none" stroke="#333333" stroke-width="44"
    stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="226" cy="596" r="64" fill="#f4f4f2"/>
  <circle cx="571" cy="700" r="64" fill="#f4f4f2"/>
  <circle cx="416" cy="330" r="78" fill="#c6f24e"/>
  <circle cx="786" cy="470" r="78" fill="#c6f24e"/>
</svg>
